name: Hargow product
on: [push, pull_request]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: docker build -f infra/Dockerfile.web -t hargow-web:test .
      - name: Verify actual product SSR image
        run: node framework/scripts/product-web-smoke.mjs hargow-web:test hargow
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm install -g pnpm@11.11.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:web
